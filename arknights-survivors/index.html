		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #070c11;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<style>
/* 网页启动加载页「声呐测绘」（用户 10-25 定：对照图方向 C 第一张；视觉按 docs/37，接指挥圆盘 / 小地图的声呐样式）。
   声呐圈 = 进度环 + 扫描扇面；左下终端日志逐行 [OK]；右下提示；左上标志（loader_logo.png = art/ui/title_deep/logo_mark.png）。
   扫描扇面用 transform 动画（合成线程跑，引擎启动占住主线程时也在转）；系统「减少动态效果」时不转。 */
#sy-load {
  position: fixed; inset: 0; z-index: 9000; overflow: hidden;
  background: radial-gradient(ellipse at 50% 50%, #0d1820 0%, #070c11 70%, #04070a 100%);
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; color: #e6eef2;
  transition: opacity .4s;
}
#sy-load.sy-out { opacity: 0; pointer-events: none; }
/* 读完后的「开始游戏」（11-01，同桌面 boot_views.draw_start）：放在声呐圈（方向 0）/ 盘（方向 3）下面（top 由 loader.js 按圈的外框算），
   方向 3 的 RHODES ISLAND 让位；整页任意处点 / 按任意键都算。动效（11-01 用户「加载页开始游戏的动效也做一下」）：
   出现 —— 引线从「接入完成」接触点落下（.sy-lead，loader.js 画）→ 四角饰角收拢锁定、外框闪一圈 → 竖扫描线左到右揭开底色 → 边框从上沿正中向两边描出
          → 四个字乱码逐个解出（loader.js）→ 英文打字机；
   待机 —— 框线呼吸 + 一段青光沿边框慢转（5.5 秒一圈）+ 左右两枚小方框反向慢转；
   悬停 / 键盘聚焦 —— 边框收紧 3 像素、饰角外扩、外圈青色微光；
   按下（.on）—— 反白 + 整屏一下压暗（.sy-dim）+ 三圈声呐脉冲扩到整屏（.sy-pulse），引擎 0.28 秒后揭开标题页、本页淡出。减少动态效果：只淡入，不乱码、不转、不发脉冲 */
#sy-load .sy-go {
  position: absolute; left: 50%; top: 70%; width: 232px; height: 50px; margin-left: -116px; z-index: 20;
  background: none; border: 0; color: #edf2f5; cursor: pointer; outline: none;
  font: inherit; font-size: 20px; letter-spacing: 2px; padding: 0;
}
#sy-load .sy-go > * { pointer-events: none; }
#sy-load .sy-go .fl, #sy-load .sy-go .gw { position: absolute; inset: 0; transition: inset .12s ease-out, opacity .12s; }
#sy-load .sy-go .fl { background: rgba(5, 13, 18, .86); animation: sy-scan-fill .3s linear .3s backwards; }
#sy-load .sy-go .sc { position: absolute; top: -7px; bottom: -7px; left: 0; width: 1.5px; background: #5ee6e6; box-shadow: -8px 0 14px rgba(94, 230, 230, .35); opacity: 0;
  animation: sy-scan .3s linear .3s; }
#sy-load .sy-go .gw { opacity: 0; box-shadow: 0 0 0 2px rgba(94, 230, 230, .16), 0 0 14px rgba(94, 230, 230, .28); background: rgba(94, 230, 230, .1); }
#sy-load .sy-go .fr { position: absolute; left: 0; top: 0; overflow: visible; transition: transform .12s ease-out; }   /* 尺寸 / 路径由 loader.js 按按钮像素写 */
#sy-load .sy-go .fr path { fill: none; }
#sy-load .sy-go .fr .tr { stroke: rgba(223, 233, 238, .85); stroke-width: 1.5; stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: sy-trace .45s cubic-bezier(.2, .7, .3, 1) .35s forwards, sy-fade .1s linear .8s forwards; }
#sy-load .sy-go .fr .bd { stroke: #5ee6e6; stroke-width: 1.5; opacity: 0; animation: sy-in .1s linear .8s forwards, sy-br 2.4s ease-in-out .9s infinite; }
#sy-load .sy-go .fr .fw { stroke: #5ee6e6; stroke-width: 2; stroke-dasharray: 8 92; opacity: 0; animation: sy-in .3s linear 1.1s forwards, sy-flow 5.5s linear 1.1s infinite; }
#sy-load .sy-go::after { content: ""; position: absolute; inset: -2px; border: 1px solid #5ee6e6; opacity: 0; animation: sy-lock .25s ease-out .45s; }
#sy-load .sy-go i { position: absolute; width: 6px; height: 6px; background: #5ee6e6; --x: 0px; --y: 0px; transform: translate(var(--x), var(--y)) rotate(45deg);
  transition: transform .12s ease-out, width .12s, height .12s; animation: sy-corner .35s cubic-bezier(.2, .7, .3, 1) .1s backwards; }
#sy-load .sy-go i.c0 { left: -4px; top: -4px; --dx: -1; --dy: -1; } #sy-load .sy-go i.c1 { right: -4px; top: -4px; --dx: 1; --dy: -1; }
#sy-load .sy-go i.c2 { right: -4px; bottom: -4px; --dx: 1; --dy: 1; } #sy-load .sy-go i.c3 { left: -4px; bottom: -4px; --dx: -1; --dy: 1; }
#sy-load .sy-go b.r0, #sy-load .sy-go b.r1 { position: absolute; top: 50%; width: 7px; height: 7px; margin-top: -4.5px; border: 1.2px solid rgba(94, 230, 230, .8); opacity: 0;
  animation: sy-in .25s linear .75s forwards, sy-spin 7s linear .75s infinite; }
#sy-load .sy-go b.r0 { left: 16px; } #sy-load .sy-go b.r1 { right: 16px; animation-direction: normal, reverse; }
#sy-load .sy-go span { position: relative; }
#sy-load .sy-go span s { text-decoration: none; display: inline-block; }
#sy-load .sy-go span s.x { color: #5ee6e6; font-family: Consolas, Menlo, monospace; font-size: .8em; min-width: 1.25em; }
#sy-load .sy-go em { position: absolute; left: -40px; right: -40px; top: calc(100% + 12px); font-style: normal; font-size: 10px; letter-spacing: 4px; color: #708794;
  clip-path: inset(0 100% 0 0); animation: sy-type .35s steps(13) .9s forwards; }
/* 悬停 / 键盘聚焦 / 手柄（loader 不收手柄，只有键盘）*/
#sy-load .sy-go:hover .fl, #sy-load .sy-go:focus-visible .fl, #sy-load .sy-go.on .fl { inset: 3px; }
#sy-load .sy-go:hover .fr, #sy-load .sy-go:focus-visible .fr, #sy-load .sy-go.on .fr { transform: scale(var(--sx), var(--sy)); }
#sy-load .sy-go:hover .gw, #sy-load .sy-go:focus-visible .gw { opacity: 1; inset: 3px; }
#sy-load .sy-go:hover .fr .bd, #sy-load .sy-go:focus-visible .fr .bd { animation-play-state: running, paused; stroke-opacity: 1; }
#sy-load .sy-go:hover i, #sy-load .sy-go:focus-visible i { --x: calc(var(--dx) * 2px); --y: calc(var(--dy) * 2px); width: 8px; height: 8px; }
/* 按下：反白 + 压暗 + 声呐脉冲 */
#sy-load .sy-go.on .fl { animation: sy-inv .26s linear both; }
#sy-load .sy-go.on span { animation: sy-inv-t .26s linear both; }
#sy-load .sy-go.on .fw, #sy-load .sy-go.on em { opacity: 0; transition: opacity .1s; }
#sy-load .sy-dim { position: absolute; inset: 0; z-index: 19; background: #000306; pointer-events: none; animation: sy-dim .5s ease-out forwards; }
#sy-load .sy-pulse { position: absolute; z-index: 19; border-radius: 50%; border: 2px solid #5ee6e6; pointer-events: none; opacity: 0;
  animation: sy-pulse .85s cubic-bezier(.2, .7, .3, 1) both; }
#sy-load .sy-pulse.p0 { box-shadow: inset 0 0 0 8px rgba(94, 230, 230, .08); }
#sy-load .sy-pulse.p1, #sy-load .sy-pulse.p2 { border-width: 1px; }
#sy-load .sy-lead { position: absolute; inset: 0; z-index: 19; pointer-events: none; overflow: visible; animation: sy-fade .6s linear .75s forwards; }
#sy-load .sy-lead line { stroke: #5ee6e6; stroke-opacity: .6; stroke-width: 1; stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: sy-trace .25s cubic-bezier(.2, .7, .3, 1) forwards; }
#sy-load .sy-lead rect { fill: none; stroke: #5ee6e6; stroke-opacity: .85; transform-box: fill-box; transform-origin: center; animation: sy-lockon .2s cubic-bezier(.2, .7, .3, 1) both; }
#sy-load.sy-ready .sv-ri { display: none; }
@keyframes sy-scan-fill { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes sy-scan { from { left: 0; opacity: 1; } 99% { left: 100%; opacity: 1; } to { left: 100%; opacity: 0; } }
@keyframes sy-trace { to { stroke-dashoffset: 0; } }
@keyframes sy-fade { to { opacity: 0; } }
@keyframes sy-in { to { opacity: 1; } }
@keyframes sy-go-in { from { opacity: 0; } }
@keyframes sy-br { 50% { stroke-opacity: .5; } }
@keyframes sy-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
@keyframes sy-lock { from { opacity: .4; transform: scale(1); } to { opacity: 0; transform: scale(1.06, 1.25); } }
@keyframes sy-corner { from { opacity: 0; transform: translate(calc(var(--dx) * 16px), calc(var(--dy) * 16px)) rotate(45deg); } }
@keyframes sy-spin { from { transform: rotate(45deg); } to { transform: rotate(405deg); } }
@keyframes sy-type { to { clip-path: inset(0 0 0 0); } }
@keyframes sy-inv { 0%, 30% { background: #dfe9ee; } 100% { background: rgba(5, 13, 18, .86); } }
@keyframes sy-inv-t { 0%, 30% { color: #060b10; } 100% { color: #edf2f5; } }
@keyframes sy-dim { from { opacity: .42; } to { opacity: 0; } }
@keyframes sy-pulse { from { opacity: .6; transform: scale(var(--s0)); } to { opacity: 0; transform: scale(1); } }
@keyframes sy-lockon { from { transform: scale(2.6); opacity: 0; } }
@media (max-height: 520px) {
  #sy-load .sy-go { width: 200px; height: 42px; margin-left: -100px; font-size: 18px; }
  #sy-load .sy-go em { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #sy-load .sy-go, #sy-load .sy-go * , #sy-load .sy-go::after { animation: none !important; }
  #sy-load .sy-go { animation: sy-go-in .25s linear both !important; }
  #sy-load .sy-go .fr .tr, #sy-load .sy-go .fr .fw, #sy-load .sy-go .sc { display: none; }
  #sy-load .sy-go .fr .bd, #sy-load .sy-go b.r0, #sy-load .sy-go b.r1 { opacity: 1; }
  #sy-load .sy-go b.r0, #sy-load .sy-go b.r1 { transform: rotate(45deg); }
  #sy-load .sy-go em { clip-path: none; }
  #sy-load .sy-go.on .fl { animation: sy-inv .26s linear both !important; }
  #sy-load .sy-go.on span { animation: sy-inv-t .26s linear both !important; }
  #sy-load .sy-lead { display: none; }
}
#sy-load .sy-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(rgba(120, 170, 190, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 170, 190, .05) 1px, transparent 1px);
  background-size: 24px 24px;
}
#sy-load .sy-logo { position: absolute; left: 40px; top: 36px; width: min(300px, 38vw); image-rendering: pixelated; }

/* 声呐圈：边长随视口，居中略偏上 */
#sy-load .sy-sonar {
  position: absolute; left: 50%; top: 45%; width: min(400px, 52vh, 60vw); aspect-ratio: 1;
  transform: translate(-50%, -50%);
}
#sy-load .sy-sonar svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#sy-load .sy-sweep { transform-origin: 0 0; animation: sy-spin 3.2s linear infinite; }
@keyframes sy-spin { to { transform: rotate(360deg); } }

@keyframes sy-blip { 0% { opacity: 0; } 4% { opacity: 1; } 60% { opacity: .15; } 100% { opacity: 0; } }

/* 矮屏（手机横屏）：面板收窄、标志变小 */
@media (max-height: 520px) {
  #sy-load .sy-logo { left: 20px; top: 16px; width: min(200px, 30vw); }

  #sy-load .sy-sweep, #sy-load .sy-blip { animation: none; }

}

/* ---------------- 启动页新方向（ui/boot_v 1–3，10-30；画法同 game/scripts/screens/boot_views.gd，写法见 loader.js 的 buildV）---------------- */

 *
 * 何时加载 Toy JS SDK：
 *   - Toy 包（export_web.py --toy 在本文件之前写 window.__SY_TOY = 1）：一律加载；
 *   - 其他包（itch / 本地）：只在像是 B站环境（域名含 bilibili / hdslb，或 UA 含 Bili）时加载；
 *   - 加载失败 / 8 秒超时 / 非 B站环境：一切照旧（浏览器自己的布局，云存档 probe 回 unsupported）。

/* B站 Toy 云存档的网页端薄封装（tools/export_web.py 接在 container.js 之后内联进 index.html；docs/89）
 *
 * Godot 侧 game/scripts/cloud_save.gd 经 JavaScriptBridge.get_interface("__syCloud") 调用，Promise → 回调（参数都是字符串）：
 *   probe(cb)          等 Toy SDK 加载结束（container.js 的 window.__syToyWait），cb("supported" | "unsupported")：
 *                      只看 toy.isSupport('getCloudStorage' / 'setCloudStorage')，不调 getUserProfile、不读 toyOpenId
 *   read(cb)           toy.getCloudStorage()（不带 key = 读全部，一次请求）→ cb("ok", JSON 串) / cb("err", 错误 JSON)
 *   write(json, cb)    toy.setCloudStorage(items)（一次请求带全部分片）→ cb("ok", "") / cb("err", 错误 JSON)
 *   stage(json)        存下最新打包好的内容（空串 = 清掉）；页面隐藏（visibilitychange hidden / pagehide）时这里自己上传一次，
 *                      不经过 Godot（那时引擎可能已经停帧）。成功后清掉，Godot 下次同步时读云端比对即可。
 * 错误 JSON：{code, type, msg}（SDK 的 error.code / error.type / message；307044 = 限流）。
 * 非 B站环境（itch、普通浏览器）：window.toy 不存在，probe 回 "unsupported"，Godot 侧什么都不做。
 */
(function () {
  var staged = "";
  var busy = 0;

  function waitToy() {
    if (typeof window.__syToyWait === "function") return window.__syToyWait();
    return Promise.resolve(window.toy || null);
  }
  function errJson(e) {
    var o = { code: 0, type: "", msg: "" };
    try {
      if (e && typeof e === "object") {
        o.code = Number(e.code) || 0;
        o.type = String(e.type || "");
        o.msg = String(e.message || e.msg || "");
      } else {
        o.msg = String(e);
      }
    } catch (x) {}
    return JSON.stringify(o);
  }
  function call(cb, a, b) {
    try { cb(a, b); } catch (x) {}
  }

  function flushHidden() {
    var toy = window.toy;
    if (!staged || busy || !toy || typeof toy.setCloudStorage !== "function") return;
    var json = staged;
    var items;
    try { items = JSON.parse(json); } catch (x) { staged = ""; return; }
    busy++;
    Promise.resolve().then(function () { return toy.setCloudStorage(items); }).then(function () {
      if (staged === json) staged = "";
    }).catch(function () {}).then(function () { busy--; });
  }

  window.__syCloud = {
    probe: function (cb) {
      waitToy().then(function (toy) {
        if (!toy || typeof toy.isSupport !== "function") return "unsupported";
        return Promise.all([toy.isSupport("getCloudStorage"), toy.isSupport("setCloudStorage")]).then(function (r) {
          return r[0] && r[1] ? "supported" : "unsupported";
        });
      }).catch(function () { return "unsupported"; }).then(function (r) { call(cb, r, ""); });
    },
    read: function (cb) {
      busy++;
      Promise.resolve().then(function () { return window.toy.getCloudStorage(); }).then(function (r) {
        busy--;
        call(cb, "ok", JSON.stringify(r || {}));
      }, function (e) {
        busy--;
        call(cb, "err", errJson(e));
      });
    },
    write: function (json, cb) {
      busy++;
      Promise.resolve().then(function () { return window.toy.setCloudStorage(JSON.parse(json)); }).then(function () {
        busy--;
        if (staged === json) staged = "";
        call(cb, "ok", "");
      }, function (e) {
        busy--;
        call(cb, "err", errJson(e));
      });
    },
    stage: function (json) { staged = json ? String(json) : ""; },
    staged: function () { return staged; }
  };

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") flushHidden();
  });
  window.addEventListener("pagehide", flushHidden);
})();

/* 战绩分享卡的网页端薄封装（tools/export_web.py 接在 cloud.js 之后内联进 index.html；10-28 用户定样式 B）
 *
 * Godot 侧 game/scripts/screens/share_toy.gd 经 JavaScriptBridge.get_interface("__syShare") 调用，Promise → 回调（参数都是字符串）：
 *   probe(cb)        等 Toy SDK 加载结束，cb(JSON {profile, qr, album})：只看 toy.isSupport，不调别的

    var i = s.indexOf("base64,");
    return i >= 0 ? s.substr(i + 7) : s;
  }
  // 头像 URL → PNG base64（跨域图要 crossOrigin；画不进画布就当没有头像）
  function avatarB64(url) {
    return new Promise(function (ok) {
      if (!url) return ok("");
      var img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function () {
        try {
          var c = document.createElement("canvas");
          c.width = 128; c.height = 128;
          c.getContext("2d").drawImage(img, 0, 0, 128, 128);
          ok(stripB64(c.toDataURL("image/png")));
        } catch (x) { ok(""); }
      };
      img.onerror = function () { ok(""); };
      img.src = url;
      setTimeout(function () { ok(""); }, 6000);
    });
  }
  function download(b64) {
    var bin = atob(b64), n = bin.length, u8 = new Uint8Array(n);
    for (var i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([u8], { type: "image/png" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = "Arknights_Survivors_Hasil.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  window.__syShare = {
    probe: function (cb) {
      waitToy().then(function (toy) {
        return Promise.all([sup(toy, "getUserProfile"), sup(toy, "getQrCode"), sup(toy, "saveImageToAlbum")]);
      }).catch(function () { return [false, false, false]; }).then(function (r) {
        call(cb, JSON.stringify({ profile: r[0], qr: r[1], album: r[2] }), "");
      });
    },
    profile: function (cb) {
      Promise.resolve().then(function () { return window.toy.getUserProfile(); }).then(function (p) {
        var nick = String((p && p.nickname) || "");
        return avatarB64(p && p.avatar).then(function (b64) {
          call(cb, "ok", JSON.stringify({ nickname: nick, avatar: b64 }));
        });
      }, function () { call(cb, "err", ""); });
    },
    qr: function (size, cb) {
      Promise.resolve().then(function () { return window.toy.getQrCode({ size: Math.max(80, Math.min(1024, Number(size) | 0)) }); }).then(function (r) {
        call(cb, "ok", stripB64(r && r.base64));
      }, function () { call(cb, "err", ""); });
    },
    save: function (b64, cb) {
      var toy = window.toy;
      sup(toy, "saveImageToAlbum").then(function (ok) {
        if (ok) {
          return toy.saveImageToAlbum({ base64Data: "data:image/png;base64," + b64, hintMsg: "Simpan kartu hasil ke album" }).then(function () { call(cb, "album", ""); });
        }
        download(b64);
        call(cb, "download", "");
      }).catch(function () {
        try { download(b64); call(cb, "download", ""); } catch (x) { call(cb, "err", ""); }
      });
    },
  };
})();
</script>

(function(){

      document.body.appendChild(e);
    }

  }
  function chk(){ var e = ov(); e.style.display = (innerHeight > innerWidth) ? 'flex' : 'none'; }
  addEventListener('resize', chk); addEventListener('orientationchange', chk);
  document.addEventListener('DOMContentLoaded', chk);
  document.addEventListener('touchend', function(){
    try {
      var el = document.documentElement;
      var f = el.requestFullscreen || el.webkitRequestFullscreen;
      if (f && !document.fullscreenElement) {
        var p = f.call(el);
        if (p && p.then) p.then(function(){ if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); }).catch(function(){});

			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">

			<div id="status-notice"></div>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":51283624,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
