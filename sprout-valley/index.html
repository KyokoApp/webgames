<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='en'>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover' />
	<title>Sprout Valley</title>
	<link id='-gd-engine-icon' rel='icon' type='image/png' href='index.icon.png' />
	<link rel='apple-touch-icon' href='index.apple-touch-icon.png' />
	<style>
		* {
			box-sizing: border-box;
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
		}
		html, body {
			touch-action: none;
			margin: 0;
			border: 0;
			padding: 0;
			text-align: center;
			background-color: #000000;
			overflow: hidden;
			width: 100vw;
			height: 100dvh;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}
		#canvas-container {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #000000;
			overflow: hidden;
		}
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: crisp-edges;
			image-rendering: pixelated;
			touch-action: none;
		}
		#canvas:focus {
			outline: none;
		}
		#loading-screen {
			position: absolute;
			inset: 0;
			background-color: #1a162b;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 999;
			transition: opacity 0.4s ease-out;
		}
		#loading-screen.fade-out {
			opacity: 0;
			pointer-events: none;
		}
		.spinner {
			width: 48px;
			height: 48px;
			border: 4px solid rgba(255, 255, 255, 0.15);
			border-top-color: #72dec2;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
			margin-bottom: 20px;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		.loading-title {
			color: #ffffff;
			font-size: 20px;
			font-weight: 700;
			letter-spacing: 0.5px;
			margin-bottom: 8px;
		}
		.loading-status {
			color: #a5a1b8;
			font-size: 13px;
			margin-bottom: 20px;
			min-height: 18px;
			padding: 0 16px;
		}
		.progress-bar-bg {
			width: 240px;
			max-width: 80vw;
			height: 8px;
			background-color: rgba(255, 255, 255, 0.1);
			border-radius: 999px;
			overflow: hidden;
		}
		.progress-bar-fill {
			width: 0%;
			height: 100%;
			background: linear-gradient(90deg, #56ab91, #72dec2);
			border-radius: 999px;
			transition: width 0.15s ease-out;
		}
	</style>
</head>
<body>
	<div id="canvas-container">
		<canvas id="canvas">
			Browser kamu tidak mendukung canvas HTML5.
		</canvas>
	</div>

	<div id="loading-screen">
		<div class="spinner"></div>
		<div class="loading-title">Sprout Valley</div>
		<div class="loading-status" id="loading-text">Memuat game...</div>
		<div class="progress-bar-bg">
			<div class="progress-bar-fill" id="bar-fill"></div>
		</div>
	</div>

	<script>
		const originalFetch = window.fetch.bind(window);
		let cachedPCKPromise = null;
		let pckDownloadDone = false;

		async function fetchPartWithRetry(url, retries = 3) {
			for (let attempt = 1; attempt <= retries; attempt++) {
				try {
					const res = await originalFetch(url);
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					return res;
				} catch (err) {
					if (attempt === retries) throw err;
					await new Promise((r) => setTimeout(r, 1000 * attempt));
				}
			}
		}

		function loadSplitPCK() {
			if (cachedPCKPromise) return cachedPCKPromise;

			cachedPCKPromise = (async () => {
				const loadingText = document.querySelector('#loading-text');
				const barFill = document.querySelector('#bar-fill');
				const parts = ['index.pck.part_aa', 'index.pck.part_ab', 'index.pck.part_ac'];
				const totalBytes = 119837536;
				const baseDir = new URL('.', window.location.href).href;
				const merged = new Uint8Array(totalBytes);
				let offset = 0;

				let cache = null;
				try {
					if ('caches' in window) {
						cache = await caches.open('sprout-pck-v1');
					}
				} catch (e) {
					console.warn('CacheStorage tidak tersedia:', e);
				}

				try {
					for (let i = 0; i < parts.length; i++) {
						const partUrl = new URL(parts[i], baseDir).href;
						let res = null;

						if (cache) {
							try {
								res = await cache.match(partUrl);
							} catch (e) {}
						}

						if (!res) {
							res = await fetchPartWithRetry(partUrl, 3);
							if (cache) {
								try {
									cache.put(partUrl, res.clone());
								} catch (e) {}
							}
						}

						const reader = res.body.getReader();
						while (true) {
							const { done, value } = await reader.read();
							if (done) break;
							merged.set(value, offset);
							offset += value.length;

							const pct = Math.min(95, Math.floor((offset / totalBytes) * 95));
							const mbLoaded = (offset / (1024 * 1024)).toFixed(1);
							const mbTotal = (totalBytes / (1024 * 1024)).toFixed(1);
							if (barFill) barFill.style.width = pct + '%';
							if (loadingText) {
								loadingText.textContent = `Mengunduh (${i + 1}/${parts.length}): ${mbLoaded} / ${mbTotal} MB (${pct}%)`;
							}
						}
					}

					pckDownloadDone = true;
					if (loadingText) loadingText.textContent = 'Memuat engine Godot...';
					if (barFill) barFill.style.width = '96%';

					const singleStream = new ReadableStream({
						start(controller) {
							controller.enqueue(merged);
							controller.close();
						}
					});

					return new Response(singleStream, {
						status: 200,
						statusText: 'OK',
						headers: {
							'Content-Type': 'application/octet-stream',
							'Content-Length': String(merged.byteLength)
						}
					});
				} catch (err) {
					cachedPCKPromise = null;
					if (loadingText) loadingText.textContent = 'Gagal memuat: ' + err.message + ' (Muat ulang halaman)';
					throw err;
				}
			})();

			return cachedPCKPromise;
		}

		window.fetch = function(input, init) {
			const url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
			if (url.endsWith('index.pck') || (url.includes('index.pck') && !url.includes('.part_'))) {
				return loadSplitPCK();
			}
			return originalFetch(input, init);
		};
	</script>

	<script src="index.js"></script>
	<script>
		const loadingScreen = document.querySelector('#loading-screen');
		const loadingText = document.querySelector('#loading-text');
		const barFill = document.querySelector('#bar-fill');

		const GODOT_CONFIG = {
			args: [],
			canvasResizePolicy: 2,
			executable: "index",
			experimentalVK: false,
			fileSizes: { "index.pck": 119837536, "index.wasm": 13790961 },
			focusCanvas: true,
			gdnativeLibs: []
		};

		const engine = new Engine(GODOT_CONFIG);

		if (!Engine.isWebGLAvailable()) {
			if (loadingText) loadingText.textContent = 'Browser kamu belum mendukung WebGL.';
		} else {
			const stages = [
				'Memuat engine & data...',
				'Kompilasi shader WebGL...',
				'Menyiapkan pulau Sprout Valley...',
				'Membuka game...'
			];
			let stageIdx = 0;
			const stageTimer = setInterval(() => {
				if (!pckDownloadDone) return;
				stageIdx = (stageIdx + 1) % stages.length;
				if (loadingText) loadingText.textContent = stages[stageIdx];
				if (barFill) {
					const cur = parseInt(barFill.style.width || '96', 10);
					if (cur < 99) barFill.style.width = (cur + 1) + '%';
				}
			}, 1800);

			engine.startGame({
				onProgress: function(current, total) {
					if (total > 0 && barFill) {
						const pct = Math.floor((current / total) * 100);
						barFill.style.width = Math.max(parseInt(barFill.style.width || '0', 10), pct) + '%';
					}
				}
			}).then(() => {
				clearInterval(stageTimer);
				cachedPCKPromise = null;
				if (barFill) barFill.style.width = '100%';
				if (loadingText) loadingText.textContent = 'Selamat bermain!';
				const canvasElem = document.getElementById('canvas');
				if (canvasElem) canvasElem.focus();
				if (loadingScreen) {
					loadingScreen.classList.add('fade-out');
					setTimeout(() => {
						if (loadingScreen.parentNode) loadingScreen.remove();
						if (canvasElem) canvasElem.focus();
					}, 400);
				}
			}).catch((err) => {
				clearInterval(stageTimer);
				console.error('[Godot Startup Error]', err);
				if (loadingText) loadingText.textContent = 'Gagal memulai game: ' + (err.message || err);
			});
		}
	</script>
</body>
</html>
