<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>OneMoreRoute</title>
    <link rel="icon" type="image/svg+xml" href="./assets/OneMore_Logo_3D-BFMIRq-L.svg" />
    <script type="module" crossorigin src="./assets/index-Cpq_oOnJ.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/scale-0HYqc4D3.js">
    <link rel="modulepreload" crossorigin href="./assets/loading-CMSBb2yR.js">
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-BaNbYf_w.js">
    <link rel="modulepreload" crossorigin href="./assets/host-BOQMks4a.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DX9QSe7r.css">
    <style>
      html,body{overscroll-behavior:none;touch-action:none}
      @media (max-width:860px),(max-height:540px){
        .topbar{max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;height:44px;top:8px;left:8px}
        .topbar::-webkit-scrollbar{display:none}
        .toolbox{top:58px;left:8px;max-height:calc(100dvh - 130px);overflow-y:auto}
        .win{max-width:calc(100vw - 16px)!important;max-height:calc(100dvh - 68px)!important}
        .buildbar{max-width:calc(100vw - 16px);overflow-x:auto;bottom:8px}
        #newmap{max-height:calc(100dvh - 96px);overflow-y:auto}
      }
      @media (max-width:720px){
        #newmap .newmap-top,#newmap .newmap-bottom{grid-template-columns:1fr!important;gap:12px!important}
        #newmap .newmap-preview{min-height:140px!important}
      }
    </style>
  </head>
  <body data-theme="atlas">
    <div id="map"></div>

    <div id="hud">
      <div class="panel dock topbar">
        <span class="stat balance"><i data-icon="coin"></i><span><small>Balance</small><b id="balance"></b></span></span>
        <span class="stat"><i data-icon="trend"></i><span><small>Today</small><b id="today" class="up"></b></span></span>
        <span class="stat"><i data-icon="calendar"></i><span><small id="period">Day</small><b id="date"></b></span></span>
        <span class="speed">
          <button data-speed="0" title="Pause" aria-label="Pause"><i data-icon="pause"></i></button>
          <button data-speed="1" class="on" title="Play" aria-label="Play"><i data-icon="play"></i></button>
          <button data-speed="3" title="Fast" aria-label="Fast"><i data-icon="fast"></i></button>
          <button data-speed="10" title="Very fast" aria-label="Very fast"><i data-icon="faster"></i></button>
          <button data-speed="40" title="Time lapse" aria-label="Time lapse"><i data-icon="fastest"></i></button>
          <span id="pace" class="off"></span>
        </span>
        <button id="feedback-toggle" class="btn square" title="Report a bug" aria-label="Report a bug"><i data-icon="bug"></i></button>
        <button id="wiki-toggle" class="btn square" title="Wiki" aria-label="Wiki"><i data-icon="wiki"></i></button>
        <button id="settings-toggle" class="btn square" title="Settings" aria-label="Settings"><i data-icon="settings"></i></button>
      </div>

      <div class="panel dock toolbox" id="toolbox"></div>
      <div class="dock buildbar" id="buildbar" hidden></div>
      <div class="dock buildbar" id="upgradebar" hidden></div>
      <div class="dock buildbar" id="overlaybar" hidden></div>
      <div class="dock buildviews" id="buildviews" hidden></div>
      <div class="dock viewdock" id="viewdock"></div>
      <div class="panel dock mediabar" id="mediabar" hidden></div>

      <div id="settings" hidden>
        <div id="settings-general">
        <div class="section menu-only" id="updates" hidden>
        <small id="updates-title">Updates</small>
        <div id="updates-channel"></div>
        </div>
        <div class="actions game-only">
          <button class="btn wide files-only" id="saves-open"><i data-icon="download"></i><span>Save and load</span></button>
          <button class="btn wide no-files" id="save-download"><i data-icon="download"></i><span>Download save</span></button>
          <button class="btn wide no-files" id="save-upload"><i data-icon="upload"></i><span>Load save file</span></button>
          <button class="btn wide" id="to-menu"><i data-icon="back"></i><span>Main menu</span></button>
        </div>
        <div class="actions" id="quit-row" hidden>
          <button class="btn wide" id="quit"><i data-icon="quit"></i><span>Quit</span></button>
        </div>
        <input id="save-file" type="file" accept=".json,application/json" hidden />
        </div>
      </div>

      <div id="gamesettings" hidden>
        <small id="difficulty-title">Difficulty</small>
        <div id="difficulty"></div>
        <button class="btn wide" id="detail-open"><i data-icon="gauge"></i><span>Simulation detail</span><b id="detail-value"></b></button>
        <small id="money-title">Money</small>
        <div id="money-unlimited"></div>
        <small>Map seed <span class="seed"><span id="seed"></span><button class="copy" id="seed-copy" title="Copy the seed" aria-label="Copy the seed"><i data-icon="copy"></i></button></span></small>
      </div>

      <div id="sound" hidden></div>

      <div id="graphics" hidden></div>

      <div id="keys" hidden></div>

      <div id="versions" hidden></div>

      <div id="newmap" hidden>
        <div class="newmap-top">
          <div class="newmap-land">
            <small>Size <span id="map-size-value"></span></small>
            <input id="map-size" type="range" min="0" step="1" />
            <small>Cities <span id="map-cities-value"></span></small>
            <input id="map-cities" type="range" min="0" max="4" step="1" />
            <small>Industries <span id="map-industries-value"></span></small>
            <input id="map-industries" type="range" min="0" max="4" step="1" />
            <small>Water <span id="map-water-value"></span></small>
            <input id="map-water" type="range" min="0" max="100" step="5" />
            <small>Forest <span id="map-forest-value"></span></small>
            <input id="map-forest" type="range" min="0" max="100" step="5" />
          </div>
          <div class="newmap-preview"><canvas id="map-preview"></canvas></div>
        </div>
        <div class="newmap-bottom">
          <div>
            <small id="map-difficulty-title">Difficulty</small>
            <div id="map-difficulty"></div>
            <button class="btn wide" id="map-detail-open"><i data-icon="gauge"></i><span>Simulation detail</span><b id="map-detail-value"></b></button>
            <small>Money</small>
            <div id="map-money"></div>
          </div>
          <div>
            <small>Seed</small>
            <div class="field">
              <input id="map-seed" type="text" spellcheck="false" autocomplete="off" maxlength="24" />
              <button class="btn square" id="map-seed-random" title="Random seed" aria-label="Random seed"><i data-icon="dice"></i></button>
            </div>
            <button class="btn wide tick" id="map-tutorial"><i data-icon="check"></i><span>Tutorial</span></button>
            <div class="buttons"><button class="btn" id="map-reset"><span>Defaults</span></button><button id="map-create" class="btn primary"><i data-icon="check"></i><span>Create map</span></button></div>
          </div>
        </div>
      </div>

      <div id="menu" hidden></div>
      <div class="tip" id="tip" hidden></div>
      <div class="toasts" id="toasts"></div>
    </div>

    <div id="phone" hidden></div>

    <!-- Until the game is loaded and its menu is up. Its looks are here, since the stylesheet comes with the script. -->
    <div id="loading" role="status" aria-live="polite">
      <div class="loading-box">
        <b id="loading-name">OneMoreRoute</b>
        <div class="loading-bar"><i id="loading-fill"></i></div>
        <small id="loading-note">Loading</small>
      </div>
    </div>
    <style>#loading{z-index:150000;--loading-background:#ebe4cc;color:#33301f;place-items:center;font:13px/1.3 system-ui,sans-serif;transition:opacity .35s;display:grid;position:fixed;inset:0}#loading:before{content:"";background:var(--loading-background);transition:opacity 1.1s;position:absolute;inset:0}#loading.menu-reveal:before{opacity:0}#loading.logo-intro #loading-note{visibility:hidden}#loading.menu-reveal #loading-note{opacity:0;transition:opacity .25s}#loading[hidden]{display:none}#loading.done{opacity:0;pointer-events:none}.loading-box{justify-items:center;gap:16px;width:min(320px,70vw);display:grid;position:relative}#loading-name{letter-spacing:.01em;font-size:30px}#loading-logo{transform-origin:0 0;width:100%;height:auto;display:block}.loading-line-fill{transform:scaleX(var(--loading-progress,0));transform-origin:0 0;transition:transform .35s linear}#loading.has-logo .loading-bar{display:none}#loading.reset-progress .loading-line-fill{transition:none}@media (prefers-reduced-motion:reduce){.loading-line-fill{transition:none}}.loading-bar{background:#33301f24;border-radius:4px;width:100%;height:8px;overflow:hidden}.loading-bar i{background:#2f4f46;border-radius:4px;width:4%;height:100%;transition:width .3s;display:block}#loading small{text-transform:uppercase;letter-spacing:.06em;opacity:.7;font-size:11px}body[data-theme=night] #loading{--loading-background:#0a1018;color:#d7ecf7}body[data-theme=night] .loading-bar{background:#4fd8ff24}body[data-theme=night] .loading-bar i{background:#4fd8ff}body[data-theme=paper] #loading{--loading-background:#f3f0e9;color:#2a2a2e}body[data-theme=paper] .loading-bar i{background:#2a2a2e}</style>

  </body>
</html>
